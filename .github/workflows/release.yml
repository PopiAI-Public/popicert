name: Release

# Al crear un tag vX.Y.Z se publica la imagen en GHCR con ese mismo tag.
# Nunca se publica `latest`: en producción siempre se despliega un tag concreto.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publicar la imagen en GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/popiai-public/popicert
          flavor: latest=false
          tags: type=ref,event=tag
          labels: |
            org.opencontainers.image.title=PopiCert
            org.opencontainers.image.description=Certificados con Open Badges 3.0
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
